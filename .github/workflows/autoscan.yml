name: auto-scan-sources
on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 auto_scan.py
      - name: commit
        run: |
          git config user.name "epg-bot"
          git config user.email "bot@users.noreply.github.com"
          git add hmt.m3u
          git diff --cached --quiet || git commit -m "autoscan $(date -u +%F-%H)"
          git push
