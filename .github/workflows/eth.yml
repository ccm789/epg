name: eth-update
on:
  schedule:
    - cron: '45 */6 * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 安装 ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffprobe -version | head -1

      - name: 更新 ETH 源 (真解码复检)
        run: python3 eth_update.py

      - name: commit
        run: |
          git config user.name "epg-bot"
          git config user.email "bot@users.noreply.github.com"
          git add eth.m3u eth.txt
          git diff --cached --quiet || git commit -m "eth update $(date -u +%F-%H)"
          git push
