name: update-kr-sg-my-epg
on:
  schedule:
    - cron: '20 */8 * * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 生成韩国/新加坡/马来西亚 EPG
        run: python update_krsgmy.py
      - name: commit
        run: |
          git config user.name "epg-bot"
          git config user.email "bot@users.noreply.github.com"
          git add epg_sg.xml epg_my.xml epg_kr.xml 2>/dev/null || git add epg_sg.xml epg_my.xml
          git diff --cached --quiet || git commit -m "kr-sg-my update $(date -u +%F-%H)"
          git push
