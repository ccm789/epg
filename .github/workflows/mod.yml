name: mod-daily
# 每日测活 mod_live.m3u：剔除失效源，有变化自动提交
on:
  schedule:
    - cron: '50 3 * * *'   # UTC 03:50 = 北京时间 11:50
  workflow_dispatch:        # 支持手动触发

permissions:
  contents: write

jobs:
  daily-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 测活并更新
        run: python3 update_mod.py

      - name: 提交
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add mod_live.m3u
          git diff --cached --quiet || (git commit -m "mod_live 每日测活 $(date -u +%F)" && git pull --rebase --autostash origin main && git push)
