name: update-epg
on:
  schedule:
    - cron: '40 */8 * * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install opencc-python-reimplemented
      - run: python update_epg.py
      - run: python patch_hmt.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: commit
        run: |
          git config user.name "epg-bot"
          git config user.email "bot@users.noreply.github.com"
          git add epg.xml
          git diff --cached --quiet || git commit -m "auto update $(date -u +%F)"
          git push
